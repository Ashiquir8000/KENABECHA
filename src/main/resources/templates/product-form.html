<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
</head>
<body>

<!-- হেডার -->
<header>
    <h2>Admin Control Panel</h2>
    <ul>
        <li><a href="/admin">Dashboard Home</a></li>
        <li><a href="/">View Live Site</a></li>
    </ul>
</header>

<hr>

<h1>Add New Product</h1>
<p>Please fill out the form to add a product.</p>

<hr>

<!-- একদম সাদামাটা HTML Form -->
<!-- ফাইল আপলোডের জন্য enctype="multipart/form-data" যোগ করা হয়েছে -->
<form action="/admin/products/save" method="post" enctype="multipart/form-data">


    <p>
        <label for="id">Product ID</label> <br>
        <input type="number" id="id" name="id" required>
    </p>
    <!-- ১. Product Name -->
    <p>
        <label for="name">Product Name:</label><br>
        <input type="text" id="name" name="name" placeholder="e.g. T-Shirt or Smart TV" required>
    </p>

    <!-- ২. Category Dropdown -->
    <p>
        <label for="category">Select Category:</label><br>
        <select id="category" name="category" required>
            <option value="">-- Choose Category --</option>
            <option value="DRESS">Dress Collection</option>
            <option value="FMCG">FMCG</option>
            <option value="ELECTRONICS">Electronics</option>
            <option value="HOME_APPLIANCES">Home Appliances</option>
        </select>
    </p>

    <!-- ৩. Price -->
    <p>
        <label for="price">Price ($):</label><br>
        <input type="number" id="price" name="price" step="0.01" placeholder="e.g. 50.00" required>
    </p>

    <!-- ৪. Stock -->
    <p>
        <label for="stock">Stock Quantity:</label><br>
        <input type="number" id="stock" name="stock" placeholder="e.g. 10" required>
    </p>

    <!-- ৫. Image File Upload (URL এর বদলে Local File) -->
    <p>
        <label for="imageFile">Product Image:</label><br>
        <input type="file" id="imageFile" name="imageFile" accept="image/*" required>
    </p>

    <!-- ৬. Description -->
    <p>
        <label for="description">Description:</label><br>
        <textarea id="description" name="description" rows="4" cols="40" placeholder="Enter product details..."></textarea>
    </p>

    <!-- Submit Button -->
    <p>
        <button type="submit">Save Product</button>
        <a href="/admin">Cancel</a>
    </p>

</form>
<hr>

<footer>
    <p>Admin Panel - Pure HTML Version</p>
</footer>

</body>
</html>
