<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash Bin - KENABECHA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ruby-red: #9B111E;
            --text-dark: #2B1810;
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
            background-image: url('/images/background.jpg');
            background-size: cover; background-attachment: fixed; background-position: center center;
            color: var(--text-dark); display: flex;
        }

        /* Sidebar (Same as Dashboard) */
        .sidebar { width: 280px; height: 100vh; position: fixed; top: 0; left: 0; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(25px); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 30px 0; z-index: 100; }
        .sidebar-header { text-align: center; padding: 0 20px 30px 20px; border-bottom: 1px solid rgba(155, 17, 30, 0.15); margin-bottom: 20px; }
        .sidebar-header i { font-size: 3rem; color: var(--ruby-red); margin-bottom: 15px; filter: drop-shadow(0 3px 5px rgba(155, 17, 30, 0.3)); }
        .sidebar-header h2 { font-family: 'Cinzel', serif; color: var(--text-dark); font-size: 1.4rem; margin: 0; font-weight: 900; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .sidebar-menu li { margin-bottom: 10px; padding: 0 20px; }
        .sidebar-menu a { text-decoration: none; color: var(--text-dark); font-weight: 600; display: flex; align-items: center; gap: 15px; padding: 12px 20px; border-radius: 12px; transition: all 0.3s; background: rgba(255, 255, 255, 0.4); }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: var(--ruby-red); color: white; box-shadow: 0 5px 15px rgba(155, 17, 30, 0.2); transform: translateX(5px); }

        .main-content { margin-left: 280px; width: calc(100% - 280px); padding: 40px; box-sizing: border-box; min-height: 100vh; }

        /* Trash Header */
        .trash-header {
            background: rgba(155, 17, 30, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(155, 17, 30, 0.2);
            padding: 30px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
        }
        .trash-header h2 { margin: 0; font-family: 'Cinzel', serif; color: var(--ruby-red); font-size: 2rem; display: flex; align-items: center; gap: 15px;}

        .btn-back {
            background: white; color: var(--text-dark); padding: 10px 20px; border-radius: 12px;
            text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Glassmorphic Table */
        .table-container { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); border-radius: 25px; border: 1px solid var(--glass-border); padding: 30px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { text-align: left; padding: 15px; color: #555; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; }
        td { padding: 15px; background: rgba(255, 255, 255, 0.6); border-top: 1px solid rgba(255,255,255,0.8); border-bottom: 1px solid rgba(255,255,255,0.8); vertical-align: middle; }
        td:first-child { border-left: 1px solid rgba(255,255,255,0.8); border-radius: 15px 0 0 15px; }
        td:last-child { border-right: 1px solid rgba(255,255,255,0.8); border-radius: 0 15px 15px 0; }

        .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; }
        .badge-cart { background: rgba(255, 152, 0, 0.1); color: #e65100; border: 1px solid rgba(255, 152, 0, 0.2); padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem;}

        .btn-restore { background: rgba(46, 125, 50, 0.15); color: #2e7d32; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .btn-restore:hover { background: #2e7d32; color: white; }

        .btn-hard-del { background: rgba(211, 47, 47, 0.15); color: #d32f2f; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer;}
        .btn-hard-del:hover { background: #d32f2f; color: white; }

        .empty-state { text-align: center; padding: 50px; color: #777; font-size: 1.2rem; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <i class="fa-solid fa-chess-king"></i>
        <h2>Admin Panel</h2>
    </div>
    <ul class="sidebar-menu">
        <li><a href="/adminF"><i class="fa-solid fa-gauge-high"></i> Dashboard Home</a></li>
        <li><a th:href="@{/admin/archived}" class="active"><i class="fa-solid fa-trash-can"></i> Trash Bin</a></li>
        <li><a href="/home"><i class="fa-solid fa-globe"></i> View Live Site</a></li>
    </ul>
</aside>

<div class="main-content">
    <div class="trash-header">
        <h2><i class="fa-solid fa-dumpster-fire"></i> Archived Products</h2>
        <a href="/adminF" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="table-container">
        <div th:if="${#lists.isEmpty(archivedProducts)}" class="empty-state">
            <i class="fa-solid fa-box-open" style="font-size: 3rem; margin-bottom: 15px; color: #ccc;"></i><br>
            Trash bin is currently empty.
        </div>

        <table th:unless="${#lists.isEmpty(archivedProducts)}">
            <thead>
            <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Remaining Stock</th>
                <th>Active Carts</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${archivedProducts}">
                <td><img th:src="${p.imageUrl}" alt="img" class="product-img"></td>
                <td style="font-weight: 700;" th:text="${p.name}"></td>
                <td th:text="${p.stock} + ' pcs'"></td>
                <td><span class="badge-cart"><i class="fa-solid fa-cart-shopping"></i> <span th:text="${cartCounts.get(p.id) ?: 0}"></span></span></td>
                <td style="display: flex; gap: 10px;">
                    <a th:href="@{/restore/{id}(id=${p.id})}" class="btn-restore"><i class="fa-solid fa-rotate-left"></i> Restore</a>

                    <a th:href="@{/permanent-delete/{id}(id=${p.id})}" class="btn-hard-del"
                       onclick="return confirm('⚠️ WARNING: This will PERMANENTLY DELETE the product and instantly remove it from customer carts! Are you sure?');">
                        <i class="fa-solid fa-skull-crossbones"></i> Permanent Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
