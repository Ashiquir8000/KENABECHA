<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENABECHA - Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ruby-red: #9B111E;
            --text-dark: #2B1810;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #fdfbfb url('/images/background.jpg') center center / cover no-repeat fixed;
            color: var(--text-dark);
            overflow-x: hidden;
            width: 100%;
        }

        /* --- Header --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        header h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
            font-weight: 900;
            font-size: 1.5rem;
        }

        #mobile-menu-toggle {
            display: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--ruby-red);
        }

        .image-search-label {
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logout-btn {
            background-color: var(--ruby-red);
            color: white;
            border: none;
            padding: 7px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- Hero Section --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 90vh;
            min-height: 520px;
            margin-top: 70px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            background: url('/images/back1.jpg') center center / cover no-repeat;
            overflow: hidden;
        }

        .hero-title {
            position: absolute;
            top: 25%;
            font-family: 'Cinzel', serif;
            font-size: 11vw;
            font-weight: 900;
            color: rgba(155, 17, 30, 0.9);
            z-index: 1;
            user-select: none;
            white-space: nowrap;
        }

        .models-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            pointer-events: none;
        }

        /* শাড়ি মডেল সামনে (Z-INDEX 3) */
        .saree-model {
            height: 75vh;
            max-height: 650px;
            position: relative;
            z-index: 3;
            object-fit: contain;
            margin-right: -4%;
        }

        /* ছেলে মডেল পেছনে (Z-INDEX 2) */
        .urban-model {
            height: 70vh;
            max-height: 610px;
            position: relative;
            z-index: 2;
            margin-left: -6%;
            object-fit: contain;
        }

        /* --- Welcome & Categories --- */
        .welcome-section {
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
            margin-top: -40px;
            padding: 0 20px 40px;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 35px 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .welcome-box h1 {
            font-size: 2.2rem;
            margin: 0 0 10px;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
        }

        .category-section {
            padding: 30px 8% 80px;
        }

        .category-section h3 {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            text-align: center;
            color: var(--ruby-red);
            margin-bottom: 40px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .category-icon {
            font-size: 3.5rem;
            color: var(--ruby-red);
            margin-bottom: 12px;
        }

        .glass-card button {
            background-color: var(--ruby-red);
            color: #FFFFFF;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        /* --- Mobile Rules --- */
        @media screen and (max-width: 768px) {
            header {
                padding: 0 16px;
                height: 60px;
            }

            header h2 {
                font-size: 1.15rem;
            }

            #mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                background: var(--ruby-red);
                color: #ffffff;
                border-radius: 50%;
                font-size: 1.1rem;
                cursor: pointer;
            }

            nav#main-nav {
                position: fixed;
                top: 60px;
                right: -100%;
                width: 220px;
                height: calc(100vh - 60px);
                background: #ffffff;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
                transition: right 0.3s ease-in-out;
                padding: 20px 16px;
                z-index: 9999;
            }

            nav#main-nav.nav-open {
                right: 0;
            }

            nav#main-nav ul {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .hero-section {
                margin-top: 60px;
                height: 55vh;
                min-height: 380px;
            }

            .hero-title {
                font-size: 3rem;
                top: 25%;
            }

            .saree-model {
                height: 44vh;
                min-height: 280px;
                margin-right: -12%;
            }

            .urban-model {
                height: 40vh;
                min-height: 250px;
                margin-left: -12%;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>KENABECHA E-Commerce</h2>

    <div id="mobile-menu-toggle" onclick="toggleNavMenu()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

    <nav id="main-nav">
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/cart"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>

            <!-- Session Dependent Links with null check -->
            <li th:if="${session != null and session.loggedInUser != null and session.loggedInUser.userName == 'admin'}">
                <a href="/adminF">Admin Dashboard</a>
            </li>
            <li th:if="${session != null and session.loggedInUser != null and session.loggedInUser.userName == 'moderator'}">
                <a href="/moderator">Moderator Hub</a>
            </li>
            <li th:if="${session != null and session.loggedInUser != null and session.loggedInUser.userName == 'inventory'}">
                <a href="/inventory">Warehouse Panel</a>
            </li>

            <li th:if="${session == null or session.loggedInUser == null}">
                <a href="/login">Login / Register</a>
            </li>
            <li th:if="${session != null and session.loggedInUser != null}">
                <form action="/logout" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<section class="hero-section">
    <div class="hero-title" id="heroText">KENABECHA</div>
    <div class="models-container">
        <img src="/images/woman.png" class="saree-model" alt="Saree Model">
        <img src="/images/man.png" class="urban-model" alt="Urban Model">
    </div>
</section>

<div class="welcome-section">
    <div class="welcome-box">
        <h1>Welcome to Our Store</h1>
        <p>Find the best products across multiple categories.</p>
    </div>
</div>

<section class="category-section">
    <h3>Browse by Category</h3>
    <ul class="category-grid">
        <li class="glass-card">
            <i class="fa-solid fa-shirt category-icon"></i>
            <a href="/category/DRESS"><button type="button">Dress Collection</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-basket-shopping category-icon"></i>
            <a href="/category/FMCG"><button type="button">FMCG Products</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-plug category-icon"></i>
            <a href="/category/ELECTRONICS"><button type="button">Electronics</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-blender category-icon"></i>
            <a href="/category/HOME_APPLIANCES"><button type="button">Home Appliances</button></a>
        </li>
    </ul>
</section>

<footer>
    <p>KENABECHA Project - 2026</p>
</footer>

<script>
    function toggleNavMenu() {
        const nav = document.getElementById('main-nav');
        if (nav) {
            nav.classList.toggle('nav-open');
        }
    }

    document.addEventListener('click', function(e) {
        const nav = document.getElementById('main-nav');
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        if (nav && nav.classList.contains('nav-open')) {
            if (!nav.contains(e.target) && !toggleBtn.contains(e.target)) {
                nav.classList.remove('nav-open');
            }
        }
    });
</script>

</body>
</html>
