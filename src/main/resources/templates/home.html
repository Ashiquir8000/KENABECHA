<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENABECHA - Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ruby-red: #9B111E;
            --text-dark: #2B1810;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #faf7f5;
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-position: center top;
            color: var(--text-dark);
            overflow-x: hidden;
            width: 100%;
        }

        /* --- 1. HEADER (ডেস্কটপে ফুল মেনু, মোবাইলে ৩-ডট) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99999;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        header h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
            font-weight: 900;
            font-size: 1.6rem;
            white-space: nowrap;
        }

        #mobile-menu-toggle {
            display: none;
        }

        nav#main-nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav#main-nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav#main-nav a:hover {
            color: var(--ruby-red);
        }

        .image-search-label {
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            color: var(--text-dark);
        }

        .image-search-label:hover {
            color: var(--ruby-red);
        }

        .logout-btn {
            background-color: var(--ruby-red);
            color: white;
            border: none;
            padding: 7px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- 2. HERO SECTION & MODELS --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 85vh;
            min-height: 520px;
            margin-top: 70px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            background-image: url('/images/back1.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .hero-title {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: 11vw;
            font-weight: 900;
            color: rgba(155, 17, 30, 0.9);
            z-index: 1;
            user-select: none;
            white-space: nowrap;
            letter-spacing: 4px;
            pointer-events: none;
        }

        .models-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            pointer-events: none;
        }

        /* মেয়ে মডেল সামনে (Z-INDEX 3) */
        .saree-model {
            height: 75vh;
            max-height: 620px;
            width: auto;
            position: relative;
            z-index: 3;
            object-fit: contain;
            margin-right: -4%;
            display: block;
        }

        /* ছেলে মডেল পেছনে (Z-INDEX 2) */
        .urban-model {
            height: 70vh;
            max-height: 580px;
            width: auto;
            position: relative;
            z-index: 2;
            margin-left: -6%;
            object-fit: contain;
            display: block;
        }

        /* --- 3. WELCOME & CATEGORIES --- */
        .welcome-section {
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
            margin-top: -40px;
            padding: 0 20px 40px;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            padding: 35px 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .welcome-box h1 {
            font-size: 2.2rem;
            margin: 0 0 10px;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
        }

        .category-section {
            padding: 30px 8% 80px;
            position: relative;
            z-index: 5;
        }

        .category-section h3 {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            text-align: center;
            color: var(--ruby-red);
            margin-bottom: 40px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .category-icon {
            font-size: 3.5rem;
            color: var(--ruby-red);
            margin-bottom: 12px;
        }

        .glass-card button {
            background-color: var(--ruby-red);
            color: #FFFFFF;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: rgba(255, 255, 255, 0.85);
            font-weight: 600;
        }

        /* --- 4. MOBILE RESPONSIVE ENGINE (Screen <= 768px) --- */
        @media screen and (max-width: 768px) {
            header {
                padding: 0 16px;
                height: 60px;
            }

            header h2 {
                font-size: 1.15rem;
            }

            #mobile-menu-toggle {
                display: flex !important;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                background: var(--ruby-red);
                color: #ffffff;
                border-radius: 50%;
                font-size: 1.1rem;
                cursor: pointer;
            }

            /* ৩-ডট ড্রয়ার */
            nav#main-nav {
                position: fixed !important;
                top: 60px !important;
                right: -100% !important;
                width: 230px !important;
                height: calc(100vh - 60px) !important;
                background: #ffffff !important;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.2) !important;
                transition: right 0.3s ease-in-out !important;
                padding: 25px 20px !important;
                z-index: 999999 !important;
                display: block !important;
            }

            nav#main-nav.nav-open {
                right: 0 !important;
            }

            nav#main-nav ul {
                flex-direction: column !important;
                gap: 16px !important;
                align-items: flex-start !important;
            }

            /* মোবাইলে হিরো সেকশন ও মডেলদের অবস্থান */
            .hero-section {
                margin-top: 60px;
                height: 55vh;
                min-height: 380px;
            }

            .hero-title {
                font-size: 3.2rem;
                top: 22%;
            }

            .saree-model {
                height: 44vh;
                min-height: 280px;
                margin-right: -14%;
                z-index: 3;
            }

            .urban-model {
                height: 40vh;
                min-height: 250px;
                margin-left: -14%;
                z-index: 2;
            }

            .welcome-section {
                margin-top: -25px;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>KENABECHA E-Commerce</h2>

    <!-- ৩-ডট বাটন -->
    <div id="mobile-menu-toggle" onclick="toggleNavMenu()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

    <!-- নেভিগেশন বার -->
    <nav id="main-nav">
        <ul>
            <li><a th:href="@{/home}">Home</a></li>
            <li>
                <form th:action="@{/search/visual}" method="post" enctype="multipart/form-data" style="margin: 0; display: flex; align-items: center;">
                    <label for="visualImageInput" class="image-search-label">
                        <i class="fa-solid fa-camera"></i> Image Search
                    </label>
                    <input type="file" id="visualImageInput" name="imageFile" accept="image/*" style="display: none;" onchange="this.form.submit();" />
                </form>
            </li>
            <li><a th:href="@{/cart}"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>

            <li th:if="${session.loggedInUser != null and session.loggedInUser.userName == 'admin'}">
                <a th:href="@{/adminF}">Admin Dashboard</a>
            </li>
            <li th:if="${session.loggedInUser != null and session.loggedInUser.userName == 'moderator'}">
                <a th:href="@{/moderator}">Moderator Hub</a>
            </li>
            <li th:if="${session.loggedInUser != null and session.loggedInUser.userName == 'inventory'}">
                <a th:href="@{/inventory}">Warehouse Panel</a>
            </li>

            <li th:if="${session.loggedInUser == null}">
                <a th:href="@{/login}">Login / Register</a>
            </li>
            <li th:if="${session.loggedInUser != null}">
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout (<span th:text="${session.loggedInUser.userName}"></span>)
                    </button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<section class="hero-section">
    <div class="hero-title" id="heroText">KENABECHA</div>
    <div class="models-container">
        <!-- saree-model আগে (Z-INDEX: 3), urban-model পরে (Z-INDEX: 2) -->
        <img th:src="@{/images/woman.png}" class="saree-model" alt="Saree Model">
        <img th:src="@{/images/man.png}" class="urban-model" alt="Urban Model">
    </div>
</section>

<div class="welcome-section">
    <div class="welcome-box">
        <h1>Welcome to Our Store</h1>
        <p>Find the best products across multiple categories.</p>
    </div>
</div>

<section class="category-section">
    <h3>Browse by Category</h3>
    <ul class="category-grid">
        <li class="glass-card">
            <i class="fa-solid fa-shirt category-icon"></i>
            <a th:href="@{/category/DRESS}"><button type="button">Dress Collection</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-basket-shopping category-icon"></i>
            <a th:href="@{/category/FMCG}"><button type="button">FMCG Products</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-plug category-icon"></i>
            <a th:href="@{/category/ELECTRONICS}"><button type="button">Electronics</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-blender category-icon"></i>
            <a th:href="@{/category/HOME_APPLIANCES}"><button type="button">Home Appliances</button></a>
        </li>
    </ul>
</section>

<footer>
    <p>KENABECHA Project - 2026</p>
</footer>

<script>
    function toggleNavMenu() {
        const nav = document.getElementById('main-nav');
        if (nav) {
            nav.classList.toggle('nav-open');
        }
    }

    document.addEventListener('click', function(e) {
        const nav = document.getElementById('main-nav');
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        if (nav && nav.classList.contains('nav-open')) {
            if (!nav.contains(e.target) && !toggleBtn.contains(e.target)) {
                nav.classList.remove('nav-open');
            }
        }
    });
</script>

</body>
</html>
