<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENABECHA - Home</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SockJS and STOMP for Real-time Chat -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        :root {
            --ruby-red: #9B111E;
            --text-dark: #2B1810;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --header-h: 75px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: #fdfbfb url('/images/background.jpg') center center / cover no-repeat;
            color: var(--text-dark);
        }

        /* -------------------------------------------------------------
           1. DESKTOP STYLES (Screen > 768px)
           ------------------------------------------------------------- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-h);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        header h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        #mobile-menu-toggle {
            display: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--ruby-red);
        }

        .image-search-label {
            cursor: pointer;
            color: var(--text-dark);
            font-weight: 600;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-size: 0.95rem;
        }

        .image-search-label:hover {
            color: var(--ruby-red);
        }

        .logout-btn {
            background-color: var(--ruby-red);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(155, 17, 30, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background-color: #7A0D17;
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            width: 100%;
            height: calc(100vh - var(--header-h));
            min-height: 550px;
            margin-top: var(--header-h);
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('/images/back1.jpg') center center / cover no-repeat;
            overflow: hidden;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(255,255,255,0.8), transparent);
            z-index: 4;
            pointer-events: none;
        }

        .hero-title {
            position: absolute;
            top: 30%;
            font-family: 'Cinzel', serif;
            font-size: 13vw;
            font-weight: 900;
            color: rgba(155, 17, 30, 0.9);
            z-index: 1;
            user-select: none;
            white-space: nowrap;
            letter-spacing: 4px;
        }

        .models-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            pointer-events: none;
        }

        /* শাড়ির মডেল সামনে (Z-INDEX 3) */
        .saree-model {
            height: 82vh;
            max-height: 700px;
            position: relative;
            z-index: 3;
            object-fit: contain;
            margin-right: -4%;
        }

        /* ছেলে মডেল পেছনে (Z-INDEX 2) */
        .urban-model {
            height: 78vh;
            max-height: 660px;
            position: relative;
            z-index: 2;
            margin-left: -6%;
            object-fit: contain;
        }

        /* Welcome Section */
        .welcome-section {
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
            margin-top: -60px;
            padding: 0 20px 40px 20px;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .welcome-box h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
        }

        /* Category Section */
        .category-section {
            padding: 30px 8% 100px 8%;
            position: relative;
            z-index: 5;
        }

        .category-section h3 {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            text-align: center;
            color: var(--ruby-red);
            margin-bottom: 50px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-8px);
        }

        .category-icon {
            font-size: 3.5rem;
            color: var(--ruby-red);
            margin-bottom: 12px;
        }

        .glass-card button {
            background-color: var(--ruby-red);
            color: #FFFFFF;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .glass-card button:hover {
            background-color: #7A0D17;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        /* Chat Widget */
        .chat-widget-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: var(--ruby-red);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(155, 17, 30, 0.35);
            z-index: 1000;
        }

        .chat-box {
            position: fixed;
            bottom: 90px;
            right: 25px;
            width: 340px;
            height: 440px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            display: none;
            flex-direction: column;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
        }

        .chat-header {
            background: var(--ruby-red);
            color: white;
            padding: 14px 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 0.88rem;
        }

        .msg-customer {
            background: var(--ruby-red);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-moderator {
            background: #f1f1f1;
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px 12px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 18px;
            outline: none;
        }

        .chat-input-area button {
            background: var(--ruby-red);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-left: 8px;
            cursor: pointer;
        }

        /* -------------------------------------------------------------
           2. MOBILE RESPONSIVE ENGINE (Screen <= 768px)
           ------------------------------------------------------------- */
        @media screen and (max-width: 768px) {
            :root {
                --header-h: 60px;
            }

            header {
                padding: 0 16px;
            }

            header h2 {
                font-size: 1.15rem;
            }

            #mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                background: var(--ruby-red);
                color: #ffffff;
                border-radius: 50%;
                font-size: 1.1rem;
                cursor: pointer;
            }

            /* ড্রয়ার হিসেবে সাইডবার */
            nav#main-nav {
                position: fixed;
                top: var(--header-h);
                right: -100%;
                width: 220px;
                height: calc(100vh - var(--header-h));
                background: #ffffff;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
                transition: right 0.3s ease-in-out;
                padding: 20px 16px;
                z-index: 9999;
                display: block;
            }

            nav#main-nav.nav-open {
                right: 0;
            }

            nav#main-nav ul {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            nav#main-nav a {
                font-size: 0.95rem;
                width: 100%;
                display: block;
            }

            /* হিরো সেকশন উচ্চতা ও মডেল ঘনিষ্ঠতা */
            .hero-section {
                height: 60vh;
                min-height: 400px;
            }

            .hero-title {
                font-size: 3rem;
                top: 28%;
            }

            .saree-model {
                height: 48vh;
                min-height: 300px;
                margin-right: -12%;
                z-index: 3;
            }

            .urban-model {
                height: 44vh;
                min-height: 270px;
                margin-left: -12%;
                z-index: 2;
            }

            .welcome-section {
                margin-top: -30px;
                padding: 0 15px 30px 15px;
            }

            .welcome-box {
                padding: 25px 15px;
            }

            .welcome-box h1 {
                font-size: 1.6rem;
            }

            .category-section {
                padding: 20px 15px 60px 15px;
            }

            .category-section h3 {
                font-size: 1.8rem;
                margin-bottom: 25px;
            }

            .category-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .chat-box {
                width: 90vw;
                right: 5vw;
                bottom: 80px;
                height: 60vh;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>KENABECHA E-Commerce</h2>

    <div id="mobile-menu-toggle" onclick="toggleNavMenu()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

    <nav id="main-nav">
        <ul>
            <li><a th:href="@{/home}">Home</a></li>
            <li>
                <form th:action="@{/search/visual}" method="post" enctype="multipart/form-data" style="margin: 0; display: flex; align-items: center;">
                    <label for="visualImageInput" class="image-search-label" title="Upload an image to find similar products">
                        <i class="fa-solid fa-camera"></i> Image Search
                    </label>
                    <input type="file" id="visualImageInput" name="imageFile" accept="image/*" style="display: none;" onchange="this.form.submit();" />
                </form>
            </li>
            <li><a th:href="@{/cart}"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>

            <li th:if="${session.loggedInUser != null and session.loggedInUser.userName == 'admin'}">
                <a th:href="@{/adminF}">Admin Dashboard</a>
            </li>

            <li th:if="${session.loggedInUser != null and session.loggedInUser.userName == 'moderator'}">
                <a th:href="@{/moderator}">Moderator Hub</a>
            </li>

            <li th:if="${session.loggedInUser != null and session.loggedInUser.userName == 'inventory'}">
                <a th:href="@{/inventory}">Warehouse Panel</a>
            </li>

            <li th:if="${session.loggedInUser == null}">
                <a th:href="@{/login}">Login / Register</a>
            </li>
            <li th:if="${session.loggedInUser != null}">
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout (<span th:text="${session.loggedInUser.userName}"></span>)
                    </button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<section class="hero-section">
    <div class="hero-title" id="heroText">KENABECHA</div>
    <div class="models-container">
        <img th:src="@{/images/woman.png}" class="saree-model" alt="Saree Model">
        <img th:src="@{/images/man.png}" class="urban-model" alt="Urban Model">
    </div>
</section>

<div class="welcome-section">
    <div class="welcome-box">
        <h1>Welcome to Our Store</h1>
        <p>Find the best products across multiple categories.</p>
    </div>
</div>

<section class="category-section">
    <h3>Browse by Category</h3>
    <ul class="category-grid">
        <li class="glass-card">
            <i class="fa-solid fa-shirt category-icon"></i>
            <a th:href="@{/category/DRESS}"><button type="button">Dress Collection</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-basket-shopping category-icon"></i>
            <a th:href="@{/category/FMCG}"><button type="button">FMCG Products</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-plug category-icon"></i>
            <a th:href="@{/category/ELECTRONICS}"><button type="button">Electronics</button></a>
        </li>
        <li class="glass-card">
            <i class="fa-solid fa-blender category-icon"></i>
            <a th:href="@{/category/HOME_APPLIANCES}"><button type="button">Home Appliances</button></a>
        </li>
    </ul>
</section>

<footer>
    <p>KENABECHA Project - 2026</p>
</footer>

<!-- 💬 LIVE CHAT WIDGET -->
<th:block th:if="${session.loggedInUser != null and session.loggedInUser.userName != 'admin' and session.loggedInUser.userName != 'moderator' and session.loggedInUser.userName != 'inventory'}">
    <div class="chat-widget-btn" onclick="toggleChat()">
        <i class="fa-regular fa-comment-dots"></i>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="chat-header">
            <span><i class="fa-solid fa-headset"></i> Live Support</span>
            <i class="fa-solid fa-xmark" onclick="toggleChat()"></i>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="msg-bubble msg-moderator">Hello! How can we help you today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <audio id="chatAudio" src="/sounds/notification.mp3" preload="auto"></audio>

    <script th:inline="javascript">
        const currentUserId = /*[[${session.loggedInUser.id}]]*/ null;
        let stompClient = null;
        let isHistoryLoaded = false;

        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            if (chatBox.style.display === 'none' || chatBox.style.display === '') {
                chatBox.style.display = 'flex';
                connectWebSocket();
                if (!isHistoryLoaded) {
                    loadChatHistory();
                }
            } else {
                chatBox.style.display = 'none';
            }
        }

        function loadChatHistory() {
            const chatMessages = document.getElementById('chatMessages');
            fetch('/chat/history/' + currentUserId)
                .then(res => res.json())
                .then(data => {
                    chatMessages.innerHTML = '<div class="msg-bubble msg-moderator">Hello! How can we help you today?</div>';
                    data.forEach(msg => {
                        appendMessage(msg.content, msg.senderType === 'CUSTOMER' ? 'msg-customer' : 'msg-moderator');
                    });
                    isHistoryLoaded = true;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                })
                .catch(err => console.error("Error loading history:", err));
        }

        function connectWebSocket() {
            if (stompClient !== null) return;
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/topic/user/' + currentUserId, function (message) {
                    const receivedMsg = JSON.parse(message.body);
                    if(receivedMsg.senderType === 'MODERATOR') {
                        appendMessage(receivedMsg.content, 'msg-moderator');
                        const audio = document.getElementById('chatAudio');
                        if (audio) audio.play().catch(e => {});
                    }
                });
            });
        }

        function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const content = inputField.value.trim();
            if (content && stompClient) {
                const messageData = {
                    userId: currentUserId,
                    senderType: 'CUSTOMER',
                    content: content
                };
                stompClient.send("/app/chat.send", {}, JSON.stringify(messageData));
                appendMessage(content, 'msg-customer');
                inputField.value = '';
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function appendMessage(text, className) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-bubble ' + className;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</th:block>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const heroText = document.getElementById('heroText');
        const heroSection = document.querySelector('.hero-section');

        if (window.innerWidth > 768 && heroSection && heroText) {
            heroSection.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                const { innerWidth, innerHeight } = window;
                const offsetX = ((clientX / innerWidth) - 0.5) * 30;
                const offsetY = ((clientY / innerHeight) - 0.5) * 15;
                heroText.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });

            heroSection.addEventListener('mouseleave', () => {
                heroText.style.transform = 'translate(0px, 0px)';
            });
        }
    });

    function toggleNavMenu() {
        const nav = document.getElementById('main-nav');
        if (nav) {
            nav.classList.toggle('nav-open');
        }
    }

    document.addEventListener('click', function(e) {
        const nav = document.getElementById('main-nav');
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        if (nav && nav.classList.contains('nav-open')) {
            if (!nav.contains(e.target) && !toggleBtn.contains(e.target)) {
                nav.classList.remove('nav-open');
            }
        }
    });
</script>

</body>
</html>
