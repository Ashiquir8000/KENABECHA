<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KARUKAJ - My Profile</title>
    <!-- Google Fonts for Luxury Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #FAF8F5;
            --text-color: #1A1A1A;
            --accent-primary: #750F22;
            --accent-gold: #C5A059;
            --border-color: #EFEAE4;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            color: var(--text-color);
        }

        /* Navbar */
        .navbar {
            background-color: #180407;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1.5rem;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links a {
            color: #EADFD5;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-primary);
        }

        .profile-header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .tab-btn:hover {
            color: var(--accent-primary);
        }

        .tab-btn.active {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-primary);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .tab-content.active {
            display: block;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #FAF8F5;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--accent-primary);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            background-color: #5a0c1a;
        }

        /* Alerts */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            background-color: #e6f4ea;
            color: #1e4620;
            border: 1px solid #cce8d6;
        }

        /* Order & Review Cards */
        .list-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .list-card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .list-card-header h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-primary);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #EFEAE4;
            color: #333;
        }
        
        .badge.PENDING { background-color: #fff3cd; color: #856404; }
        .badge.SHIPPED { background-color: #cce5ff; color: #004085; }
        .badge.DELIVERED { background-color: #d4edda; color: #155724; }
        .badge.CANCELLED { background-color: #f8d7da; color: #721c24; }

        .order-items {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .order-item:last-child {
            border-bottom: none;
        }
        
        .rating {
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }
            .tab-btn {
                width: 100%;
                border-bottom: 1px solid var(--border-color);
            }
            .tab-btn.active::after {
                display: none;
            }
            .tab-btn.active {
                background-color: #f5f5f5;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">KARUKAJ</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cart">Cart</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        
        <div class="profile-header">
            <h1>My Profile</h1>
            <p>Manage your account, view orders, and track your reviews.</p>
        </div>

        <div th:if="${successMessage}" class="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'details')">Account Details</button>
            <button class="tab-btn" onclick="openTab(event, 'orders')">Order History</button>
            <button class="tab-btn" onclick="openTab(event, 'reviews')">My Reviews</button>
        </div>

        <!-- Tab: Account Details -->
        <div id="details" class="tab-content active">
            <h2>Account Details</h2>
            <form th:action="@{/profile/update}" method="post" th:object="${user}">
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" th:value="${user.userName}" readonly style="background-color: #eee; cursor: not-allowed;">
                    <small style="color: #666;">Username cannot be changed.</small>
                </div>

                <div class="form-group">
                    <label>Mobile Numbers (comma separated)</label>
                    <input type="text" class="form-control" name="mobileNumbers" th:value="${#strings.listJoin(user.mobileNumbers, ',')}">
                </div>

                <div class="form-group">
                    <label>New Password (leave blank to keep current)</label>
                    <input type="password" class="form-control" name="userPassword">
                </div>

                <button type="submit" class="btn">Update Profile</button>
            </form>
        </div>

        <!-- Tab: Order History -->
        <div id="orders" class="tab-content">
            <h2>Order History</h2>
            <div th:if="${#lists.isEmpty(orders)}">
                <p>You have not placed any orders yet.</p>
                <a href="/" class="btn" style="margin-top: 15px;">Shop Now</a>
            </div>

            <div th:each="order : ${orders}" class="list-card">
                <div class="list-card-header">
                    <div>
                        <h3>Order #<span th:text="${order.id}"></span></h3>
                        <small style="color: #666;" th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}"></small>
                    </div>
                    <div>
                        <span class="badge" th:classappend="${order.status}" th:text="${order.status}"></span>
                    </div>
                </div>
                <div style="margin-bottom: 15px;">
                    <strong>Shipping Address:</strong> <span th:text="${order.shippingAddress}"></span>
                </div>
                <ul class="order-items">
                    <li th:each="item : ${order.orderItems}" class="order-item">
                        <span><span th:text="${item.quantity}"></span>x <span th:text="${item.product.name}"></span></span>
                        <span th:text="'$' + ${item.price * item.quantity}"></span>
                    </li>
                </ul>
                <div style="margin-top: 15px; text-align: right; border-top: 1px solid #EFEAE4; padding-top: 10px;">
                    <strong>Total: $<span th:text="${order.totalAmount}"></span></strong>
                </div>
            </div>
        </div>

        <!-- Tab: My Reviews -->
        <div id="reviews" class="tab-content">
            <h2>My Reviews</h2>
            <div th:if="${#lists.isEmpty(reviews)}">
                <p>You have not submitted any reviews yet.</p>
            </div>

            <div th:each="review : ${reviews}" class="list-card">
                <div class="list-card-header" style="border-bottom: none; margin-bottom: 5px; padding-bottom: 0;">
                    <h3><a th:href="@{'/product/' + ${review.product.id}}" style="color: inherit; text-decoration: none;" th:text="${review.product.name}"></a></h3>
                </div>
                <div class="rating">
                    <span th:each="i : ${#numbers.sequence(1, review.rating)}">
                        <i class="fa-solid fa-star"></i>
                    </span>
                    <span th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" th:if="${review.rating < 5}">
                        <i class="fa-regular fa-star"></i>
                    </span>
                </div>
                <p th:text="${review.comment}"></p>
            </div>
        </div>

    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
