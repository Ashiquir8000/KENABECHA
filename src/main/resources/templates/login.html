<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KENABECHA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ruby-red: #9B111E;
            --text-dark: #2B1810;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* ---------------------------------
           Premium Glassmorphic Header
           --------------------------------- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-sizing: border-box;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-section i {
            font-size: 2rem;
            color: var(--ruby-red);
            filter: drop-shadow(0 2px 4px rgba(155, 17, 30, 0.3));
        }

        header h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
            font-weight: 900;
            font-size: 1.8rem;
            text-shadow: 0 2px 5px rgba(255, 255, 255, 0.8);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            padding: 8px 15px;
            border-radius: 20px;
        }

        nav a:hover {
            color: white;
            background: var(--ruby-red);
            box-shadow: 0 4px 10px rgba(155, 17, 30, 0.3);
        }

        /* ---------------------------------
           Split-Screen Login Container
           --------------------------------- */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px 20px;
            box-sizing: border-box;
        }

        .glass-login-card {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* Left Side: Visual Banner (back1.jpg) */
        .login-banner {
            flex: 1;
            position: relative;
            background-image: url('/images/back1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px;
            color: white;
        }

        .login-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(155, 17, 30, 0.85) 0%, rgba(43, 24, 16, 0.6) 100%);
            z-index: 1;
        }

        .banner-content {
            position: relative;
            z-index: 2;
        }

        .banner-content i {
            font-size: 4.5rem;
            margin-bottom: 20px;
            color: #fff;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        .banner-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .banner-content p {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        /* Right Side: Login Form */
        .login-form-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.75);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-container h2 {
            font-family: 'Cinzel', serif;
            color: var(--ruby-red);
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .login-form-container > p {
            color: #555;
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        /* Error Message Styling */
        .error-message {
            background: rgba(211, 47, 47, 0.1);
            color: #d32f2f;
            padding: 12px 15px;
            border-radius: 10px;
            border-left: 4px solid #d32f2f;
            margin-bottom: 25px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid rgba(155, 17, 30, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--ruby-red);
            box-shadow: 0 0 15px rgba(155, 17, 30, 0.15);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: var(--ruby-red);
        }

        /* Form Actions */
        .btn-login {
            width: 100%;
            background-color: var(--ruby-red);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(155, 17, 30, 0.2);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            background-color: #7A0D17;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(155, 17, 30, 0.35);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #555;
        }

        .register-link a {
            color: var(--ruby-red);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: #7A0D17;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-dark);
            margin-top: auto;
        }

        hr { display: none; }

        /* Responsive Design */
        @media (max-width: 850px) {
            .glass-login-card {
                flex-direction: column;
            }
            .login-banner {
                padding: 40px 20px;
            }
            .login-form-container {
                padding: 40px 30px;
            }
        }
    </style>
    <link rel="stylesheet" th:href="@{/mobile-fix.css}">
</head>
<body>

<header>
    <div class="logo-section">
        <i class="fa-solid fa-crown"></i>
        <h2>KENABECHA E-Commerce</h2>
    </div>
    <nav>
        <ul>
            <li><a href="/home"><i class="fa-solid fa-house"></i> Home</a></li>
        </ul>
    </nav>
</header>

<div class="login-wrapper">
    <div class="glass-login-card">

        <!-- Left Side: Visual Banner -->
        <div class="login-banner">
            <div class="banner-content">
                <i class="fa-brands fa-keycdn"></i>
                <h1>Welcome Back</h1>
                <p>Log in to access your KENABECHA account and continue your premium shopping experience.</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="login-form-container">
            <h2>User Login</h2>
            <p>Please enter your credentials to proceed.</p>

            <!-- Thymeleaf Error Message -->
            <div th:if="${error}" class="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Thymeleaf Login Form (Fixed) -->
            <form action="/login" method="post">

                <!-- Hidden Redirect -->
                <input type="hidden" name="redirectTo" th:value="${redirectTo != null ? redirectTo : ''}"/>

                <!-- Username -->
                <div class="input-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>

                <div class="register-link">
                    Don't have an account? <a th:href="@{/register}">Create Here</a>
                </div>
            </form>
        </div>

    </div>
</div>

<footer>
    <p>KENABECHA Project - 2026</p>
</footer>

</body>
</html>
